syntax = "proto3";

option csharp_namespace = "ThunderPropagator.Feeviders.Grpc.SharedKernel.Protos";

package thunderpropagator.feeviders.grpc;

service GrpcFeeviderService {
  rpc Subscribe (GrpcSubscribeRequest) returns (stream GrpcEnvelope);
  rpc Publish (GrpcEnvelope) returns (GrpcPublishAck);
}

message GrpcSubscribeRequest {
  string topic = 1;
}

message GrpcEnvelope {
  string topic = 1;
  bytes payload = 2;
  map<string, string> headers = 3;
}

message GrpcPublishAck {
  bool success = 1;
}
