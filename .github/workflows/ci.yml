name: CI

on:
  push:
    branches: [develop] # beta invokes automatically on every push. Manual dispatch covers both beta and release.
  workflow_dispatch:
    inputs:
      release-mode:
        description: Channel for this manual run -- 'beta' or 'release'. Defaults to 'beta' if left unset.
        type: choice
        options:
          - beta
          - release
        default: beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  # NuGet.org Trusted Publishing (OIDC) can't run inside reusable-ci.yml itself: a
  # reusable workflow's OIDC token always names ITS OWN hosting repo/file in the
  # job_workflow_ref claim, never the caller's, no matter how the nuget.org trust
  # policy is configured (see reusable-ci.yml's nuget-auth-mode input for the full
  # explanation, and github.com/NuGet/login issues #6 and #24). So reusable-ci.yml is
  # called here with publish-to-nuget: false -- it still bumps the version, writes the
  # changelog, tags, creates the GitHub Release, builds/tests/packs, and uploads
  # pkg-*/symbols-* artifacts; it just skips its own internal NuGet publish step.
  # publish-nuget-oidc below does the actual push, as steps running directly in THIS
  # file via the KiarashMinoo/.github/.github/actions/nuget-oidc-publish composite
  # action -- because that action's steps execute inline in this job (not inside a
  # called reusable workflow), the OIDC token's job_workflow_ref names this repo +
  # this file, matching a Trusted Publishing policy configured with Repository
  # Owner=KiarashMinoo, Repository=ThunderPropagator.Feeviders, Workflow File=ci.yml.
  # Requires a NUGET_USER repo secret (the nuget.org username the policy is attached
  # to) -- Settings > Secrets and variables > Actions > Secrets.
  #
  # This repo publishes EVERY Configuration x Platform variant (no nuget-filter-enabled
  # trimming) because it deliberately ships platform-specific libraries -- so with 53
  # packable projects x 8 legs (Debug/Release x AnyCpu/x86/x64/ARM64), a single push job
  # would need ~848 pushes/run (nupkg+snupkg), well over nuget.org's ~350/hour-per-key
  # quota. The old classic-key era solved this by splitting pushes across 3-4 API keys
  # by package-ID-family prefix; under OIDC there's no equivalent of "just use a
  # different key" UNLESS each push happens as its own OIDC identity -- which nuget.org
  # supports via a Trusted Publishing policy scoped to a specific GitHub Actions
  # `environment:`, not just repo+workflow-file. So below, the single publish job is
  # split into FOUR (publish-nuget-oidc-sharedkernel/-feeders/-providers/-inboxoutbox),
  # each declaring its own `environment:` and its own nuget-package-include-pattern (see
  # nuget-oidc-publish/action.yml for that input's semantics) -- each mints an
  # independent temporary API key with its own quota bucket, worst case ~288 pushes for
  # Feeders/Providers (18 packages each x 16 legs), comfortably under 350. sharedkernel
  # covers only the 13 per-transport ThunderPropagator.Feeviders.{Transport}.SharedKernel
  # packages (208 pushes); inboxoutbox covers only the 4 InboxOutbox.* packages (64
  # pushes) -- the two top-level shared kernels (Feeders.SharedKernel,
  # Providers.DotNet.SharedKernel) AND Feeders.Inbox / Providers.DotNet.Outbox all publish
  # from the feeders/providers jobs instead, since each nuget.org Trusted Publishing
  # policy's own glob scope already covers them there (see each job's inline comment) --
  # the include pattern on every job here MUST stay in lockstep with what that job's
  # environment's policy glob actually authorizes, or pushes silently 403 regardless of
  # what the workflow attempts.
  #
  # Manual setup required (nothing here or Claude can do this on your behalf) -- already
  # done as of 2026-09-06, recorded here for future reference:
  #   1. GitHub: Settings > Environments > New environment, create all four:
  #      nuget-sharedkernel, nuget-feeders, nuget-providers, nuget-inboxoutbox
  #      (no protection rules needed -- these exist purely so nuget.org's OIDC claim
  #      validation has something to match against).
  #   2. nuget.org: account > Trusted Publishing > Add, once per environment above --
  #      Repository Owner=KiarashMinoo, Repository=ThunderPropagator.Feeviders,
  #      Workflow File=ci.yml, Environment=<that job's environment name>, Glob Pattern=
  #      ThunderPropagator.Feeviders.*.SharedKernel (sharedkernel) /
  #      ThunderPropagator.Feeders.* (feeders) / ThunderPropagator.Providers.DotNet.*
  #      (providers) / ThunderPropagator.InboxOutbox.* (inboxoutbox). Four separate
  #      policies, same repo+file, only the Environment (and matching glob) differs.
  #   3. The existing NUGET_USER repo secret is reused by all four jobs -- no new
  #      secrets needed, since Trusted Publishing never stores a long-lived key at all.
  #
  # ADMIN_PUSH_TOKEN: develop has a classic "Require a pull request before merging"
  # branch protection rule with no usable bypass for the default GITHUB_TOKEN identity
  # (github-actions[bot]) -- neither classic protection's "administrators can bypass"
  # toggle nor this (personal, non-org) repo's Ruleset bypass list can be granted to
  # that identity, only to a real admin-role account. So a Personal Access Token
  # belonging to an account with Admin role on this repo is stored as the ADMIN_PUSH_TOKEN
  # secret and passed through as push-token, which reusable-ci.yml's version job uses
  # (instead of gh-token) ONLY for the checkout that sets up the git credential the
  # later version-bump commit push reuses. That admin account's role must also be added
  # to the branch protection/ruleset's bypass list on GitHub's side for this to work.
  #
  # IMPORTANT: a job-level `permissions:` block is exhaustive, not additive -- any
  # scope not listed here is implicitly set to "none" for every nested job the called
  # reusable workflow runs, regardless of what that nested job requests for itself --
  # and GitHub validates this statically against every job reusable-ci.yml DECLARES,
  # not just the ones that will actually execute once `if:` conditions are evaluated.
  # So even with publish-to-nuget: false (which only skips publish-nuget/
  # cleanup-nuget-artifacts at runtime), this must still list every scope those two
  # jobs declare needing: contents:write (version/changelog commit, tag, GitHub
  # Release), packages:write + id-token:write (publish-nuget's GitHub Packages / OIDC
  # paths), actions:write (cleanup-nuget-artifacts, to delete run artifacts) -- or the
  # run fails at startup with "requesting X, but is only allowed none".
  #
  # beta-ci and manual-ci are gated by BOTH github.event_name and github.ref (not ref
  # alone) so a manual workflow_dispatch run from develop can't accidentally trigger
  # both jobs at once: beta-ci only ever fires on an automatic push to develop.
  # manual-ci only ever fires on a manual dispatch (from develop -- this repo doesn't
  # cut separate release/** branches -- or a release/** branch if it ever does), and
  # uses whatever channel the release-mode input was set to, defaulting to 'beta' if
  # the dispatcher left it unset -- so an unconfigured manual run is still just a beta,
  # not an accidental release.
  beta-ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    uses: KiarashMinoo/.github/.github/workflows/reusable-ci.yml@main
    with:
      channel: beta
      solution-path: 'ThunderPropagator.Feeviders.slnx'
      publish-to-nuget: false
      nuget-filter-enabled: false # every variant is published -- see the multi-job split below
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.ADMIN_PUSH_TOKEN }}

  manual-ci:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    uses: KiarashMinoo/.github/.github/workflows/reusable-ci.yml@main
    with:
      channel: ${{ inputs.release-mode }}
      solution-path: 'ThunderPropagator.Feeviders.slnx'
      publish-to-nuget: false
      nuget-filter-enabled: false # every variant is published -- see the multi-job split below
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.ADMIN_PUSH_TOKEN }}

  publish-nuget-oidc-sharedkernel:
    name: Publish packages (OIDC Trusted Publishing) — SharedKernel
    needs: [beta-ci, manual-ci]
    if: always() && (needs.beta-ci.result == 'success' || needs.manual-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-sharedkernel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          # Per-transport Feeviders shared kernels only (ThunderPropagator.Feeviders.{Transport}.SharedKernel,
          # 13 packages) -- NOT the two top-level ones (Feeders.SharedKernel, Providers.DotNet.SharedKernel),
          # which now publish from the feeders/providers jobs below instead (they're conceptually part of
          # those families, and ".Feeders."/".Providers." never accidentally matches a "Feeviders.*" name so
          # there's no overlap either way).
          nuget-package-include-pattern: '\.Feeviders\.[^.]+\.SharedKernel\.'

  publish-nuget-oidc-feeders:
    name: Publish packages (OIDC Trusted Publishing) — Feeders
    needs: [beta-ci, manual-ci]
    if: always() && (needs.beta-ci.result == 'success' || needs.manual-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-feeders
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          # The nuget.org Trusted Publishing policy on this job's environment (nuget-feeders) is
          # scoped to glob "ThunderPropagator.Feeders.*", which covers every Feeders.* package --
          # including Feeders.SharedKernel AND Feeders.Inbox. No exclude needed anymore: this job
          # now pushes all 18 Feeders.* packages, matching exactly what the policy authorizes (a
          # push outside that glob would just get rejected by nuget.org regardless of what this
          # workflow attempts, so the include pattern and the policy glob must stay in lockstep).
          nuget-package-include-pattern: '\.Feeders\.'

  publish-nuget-oidc-providers:
    name: Publish packages (OIDC Trusted Publishing) — Providers
    needs: [beta-ci, manual-ci]
    if: always() && (needs.beta-ci.result == 'success' || needs.manual-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-providers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          # Same reasoning as the feeders job above: the nuget-providers policy is scoped to glob
          # "ThunderPropagator.Providers.DotNet.*", which covers every Providers.DotNet.* package --
          # including Providers.DotNet.SharedKernel AND Providers.DotNet.Outbox -- so no exclude is
          # needed; this job pushes all 18 Providers.DotNet.* packages.
          nuget-package-include-pattern: '\.Providers\.'

  publish-nuget-oidc-inboxoutbox:
    name: Publish packages (OIDC Trusted Publishing) — InboxOutbox
    needs: [beta-ci, manual-ci]
    if: always() && (needs.beta-ci.result == 'success' || needs.manual-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-inboxoutbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          # The nuget-inboxoutbox policy is scoped to glob "ThunderPropagator.InboxOutbox.*" only --
          # it does NOT cover Feeders.Inbox or Providers.DotNet.Outbox (those now push from the
          # feeders/providers jobs above instead, since their own policies' globs already cover
          # them). Narrowed from the old 3-prefix pattern to match: this job only pushes the 4
          # InboxOutbox.{EFCore,InMemory,MongoDB,Redis} packages.
          nuget-package-include-pattern: '\.InboxOutbox\.'
