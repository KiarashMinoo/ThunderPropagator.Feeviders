name: Pack and Push

on:
  push:
    branches:
      - 'develop'

defaults:
  run:
    shell: pwsh

permissions:
  contents: write

env:
  ArtifactsDirectory: ${{ github.workspace}}/artifacts
  Project_Version: "*.*.^.*"

jobs:
  versioning_and_pack:
    runs-on: ubuntu-latest
    name: Update version and Pack nugets
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set project versions
        id: update
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: |
            "**/*.csproj", "**/*.nuspec", "**/AssemblyInfo.cs"
          version: ${{ env.Project_Version }}

      - name: Prep packages
        run: dotnet nuget add source --username KiarashMinoo --password ${{ secrets.GHP_NUGET_PACKAGE_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/KAB-TEAM/index.json"

      - name: Build solution and generate NuGet packages
        run: |
          dotnet restore
          dotnet clean          
          
          #Debug          
          dotnet build --nologo -c Debug /p:Platform=x64
          dotnet pack  --nologo -c Debug /p:Platform=x64 -o ${{ env.ArtifactsDirectory }}
          
          dotnet build --nologo -c Debug /p:Platform=x86
          dotnet pack  --nologo -c Debug /p:Platform=x86 -o ${{ env.ArtifactsDirectory }}                                                          
          
          dotnet build --nologo -c Debug 
          dotnet pack  --nologo -c Debug -o ${{ env.ArtifactsDirectory }}
          
          #Release          
          dotnet build --nologo -c Release /p:Platform=x64
          dotnet pack  --nologo -c Release /p:Platform=x64 -o ${{ env.ArtifactsDirectory }}                                                          
          
          dotnet build --nologo -c Release /p:Platform=x86
          dotnet pack  --nologo -c Release /p:Platform=x86 -o ${{ env.ArtifactsDirectory }}
          
          dotnet build --nologo -c Release 
          dotnet pack  --nologo -c Release -o ${{ env.ArtifactsDirectory }}
          
          dotnet pack  -c Debug -o ${{ env.ArtifactsDirectory }}                                             

      - name: Push latest changes to repository
        run: |
          git config user.name "Kiarash Minoo"
          git config user.email "yanis_1984@msn.com"
          git add .
          git commit -m "Update project version to ${{ steps.update.outputs.newVersion }}"
          git push            

      - uses: actions/upload-artifact@v3
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.ArtifactsDirectory }}/*.nupkg
  
  
  push_nuget:
    runs-on: ubuntu-latest
    name: Deploy to github
    needs: [ versioning_and_pack ]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: nuget
          path: ${{ env.ArtifactsDirectory }}

      - name: Prep packages
        run: dotnet nuget add source --username KiarashMinoo --password ${{ secrets.GHP_NUGET_PACKAGE_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/KAB-TEAM/index.json"

      - name: Push package to GitHub packages
        run: |
          foreach($file in (Get-ChildItem "${{ env.ArtifactsDirectory }}" -Recurse -Include *.nupkg)) {
            dotnet nuget push $file --api-key "${{ secrets.GHP_NUGET_PACKAGE_TOKEN }}" --source "github" --skip-duplicate --no-symbols
          }